<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Produk - TOKO KITA</title>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-6">
        <div id="loading" class="text-center py-8 text-gray-500 animate-pulse">Memeriksa akses token...</div>

        <div id="error" class="text-center py-8 hidden">
            <div class="text-red-500 text-4xl mb-2">❌</div>
            <h2 class="font-bold text-lg text-gray-800">Akses Ditolak / Kedaluwarsa</h2>
            <p class="text-xs text-gray-500 mt-1">Token tidak valid atau masa berlaku Anda telah habis.</p>
        </div>

        <div id="form-content" class="hidden">
            <h1 class="font-bold text-lg text-gray-800 mb-1">Tambah Produk TOKO KITA</h1>
            <p class="text-xs text-emerald-600 font-medium mb-4">Kontributor: <span id="c-name">-</span></p>

            <form onsubmit="saveProduct(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Nama Produk</label>
                    <input type="text" id="p-name" required class="w-full border rounded-lg p-2.5 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Harga (Rp)</label>
                    <input type="number" id="p-price" required min="1" class="w-full border rounded-lg p-2.5 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">URL Gambar Produk</label>
                    <input type="url" id="p-img" required placeholder="https://..." class="w-full border rounded-lg p-2.5 text-sm outline-none">
                </div>
                <button type="submit" id="btn-save" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl text-sm shadow transition">
                    Simpan Produk ke TOKO KITA
                </button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = window.TOKO_CONFIG?.API_URL || "";
        const token = new URLSearchParams(window.location.search).get('token');
        let contributorName = "";

        async function checkToken() {
            if (!API_URL || API_URL.includes("ISI_URL")) {
                document.getElementById('loading').innerText = "URL API belum diatur di config.js.";
                return;
            }
            if (!token) { showError(); return; }
            try {
                const res = await fetch(`${API_URL}?action=checkToken&token=${encodeURIComponent(token)}`);
                if (!res.ok) throw new Error("HTTP " + res.status);
                const result = await res.json();
                if (result.valid) {
                    contributorName = result.name;
                    document.getElementById('c-name').innerText = contributorName;
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('form-content').classList.remove('hidden');
                } else { showError(); }
            } catch (err) {
                console.error(err);
                showError();
            }
        }

        function showError() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
        }

        async function saveProduct(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save');
            const oriText = btn.innerText;
            btn.innerText = "Menyimpan..."; btn.disabled = true;

            const payload = {
                type: "add_product",
                name: document.getElementById('p-name').value.trim(),
                price: document.getElementById('p-price').value,
                img: document.getElementById('p-img').value.trim(),
                addedBy: contributorName,
                token: token
            };

            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const result = await res.json();
                if (result.status === "success") {
                    alert("Produk berhasil ditambahkan dan langsung tampil di TOKO KITA!");
                    e.target.reset();
                } else {
                    alert(result.error || "Gagal menyimpan produk.");
                }
            } catch (err) {
                console.error(err);
                alert("Gagal terhubung ke server: " + err.message);
            } finally {
                btn.innerText = oriText;
                btn.disabled = false;
            }
        }

        checkToken();
    </script>
</body>
</html>
