<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKO KITA - Katalog Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- Header -->
    <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">TOKO KITA</h1>
                <p class="text-xs text-emerald-100">Katalog Produk Resmi</p>
            </div>
            <button onclick="openVendorModal()" class="text-xs bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1.5 rounded-lg font-medium transition">
                + Daftar Penjual
            </button>
        </div>
    </header>

    <!-- Katalog Produk -->
    <main class="max-w-md mx-auto p-4">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Daftar Produk</h2>
        <div id="product-list" class="grid grid-cols-2 gap-3">
            <p class="text-xs text-gray-400 col-span-2 text-center py-6">Memuat produk...</p>
        </div>
    </main>

    <!-- Kartu Produk Khusus Render Gambar Share -->
    <div id="product-share-card" class="fixed -top-[9999px] left-0 w-[400px] bg-white p-6 rounded-2xl shadow-xl border border-gray-100 hidden">
        <div class="text-center mb-4">
            <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-medium">TOKO KITA</span>
        </div>
        <img id="share-img" src="" class="w-full h-48 object-cover rounded-xl mb-4" crossorigin="anonymous">
        <h2 id="share-name" class="font-bold text-lg text-gray-800 mb-1">Nama Produk</h2>
        <p id="share-price" class="text-emerald-600 font-extrabold text-xl mb-4">Rp 0</p>
        <div class="border-t pt-3 flex justify-between items-center text-xs text-gray-400">
            <span>Pesan via WhatsApp</span>
            <span>✨ TOKO KITA</span>
        </div>
    </div>

    <!-- Floating Cart Bar -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-lg hidden">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500">Total Belanja:</p>
                <p id="cart-total" class="font-bold text-emerald-600 text-lg">Rp 0</p>
            </div>
            <button onclick="openCheckoutModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-xl shadow transition text-sm">
                Checkout (<span id="cart-count">0</span>)
            </button>
        </div>
    </div>

    <!-- Modal Checkout Pembeli -->
    <div id="checkout-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">Konfirmasi Pesanan</h3>
                <button onclick="closeCheckoutModal()" class="text-gray-400 font-bold text-xl">&times;</button>
            </div>
            <div class="space-y-3 mb-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Nama Pemesan</label>
                    <input type="text" id="buyer-name" placeholder="Nama Lengkap" class="w-full border rounded-lg p-2.5 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">No WhatsApp</label>
                    <input type="text" id="buyer-phone" placeholder="628..." class="w-full border rounded-lg p-2.5 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Alamat Pengiriman</label>
                    <textarea id="buyer-address" rows="2" placeholder="Alamat lengkap..." class="w-full border rounded-lg p-2.5 text-sm outline-none"></textarea>
                </div>
            </div>

            <!-- Nota Tersembunyi -->
            <div id="receipt-area" class="bg-white p-4 border border-dashed rounded-xl mb-4 hidden">
                <div class="text-center border-b pb-2 mb-2">
                    <h4 class="font-bold text-gray-800">NOTA PESANAN - TOKO KITA</h4>
                </div>
                <div class="text-xs space-y-1 mb-2">
                    <p><strong>Pemesan:</strong> <span id="r-name">-</span></p>
                    <p><strong>Alamat:</strong> <span id="r-address">-</span></p>
                </div>
                <div id="receipt-items" class="text-xs space-y-1 border-t border-b py-2 mb-2"></div>
                <div class="flex justify-between text-xs font-bold">
                    <span>Total:</span>
                    <span id="r-total">Rp 0</span>
                </div>
            </div>

            <button onclick="processCheckout()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl text-sm shadow">
                Kirim Pesanan via WhatsApp
            </button>
        </div>
    </div>

    <!-- Modal Daftar Vendor/Penjual -->
    <div id="vendor-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">Pendaftaran Kontributor TOKO KITA</h3>
                <button onclick="closeVendorModal()" class="text-gray-400 font-bold text-xl">&times;</button>
            </div>
            <div class="space-y-3 mb-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Nama Usaha / Penjual</label>
                    <input type="text" id="v-name" placeholder="Nama Toko Anda" class="w-full border rounded-lg p-2.5 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">No WhatsApp Anda</label>
                    <input type="text" id="v-phone" placeholder="628..." class="w-full border rounded-lg p-2.5 text-sm outline-none">
                </div>
            </div>
            <div id="vendor-receipt-area" class="bg-white p-4 border border-dashed rounded-xl mb-4 hidden">
                <h4 class="font-bold text-center text-sm mb-2">NOTA PENDAFTARAN MITRA</h4>
                <p class="text-xs"><strong>Nama:</strong> <span id="vr-name">-</span></p>
            </div>
            <button onclick="submitVendorRegistration()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-medium text-sm">
                Kirim Pendaftaran via WhatsApp
            </button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbymRmzEahQ0F2ZfGR9Yvwtg0YZTE9GzPwJFFl9QLEueddu9rSxNchFhoVRYwTF0ngLpjQ/exec";
        const OWNER_WA = "6289653135369"; // Contoh: 628123456789
        let products = [];
        let cart = {};

        function getBaseUrl() {
            return window.location.href.substring(0, window.location.href.lastIndexOf('/'));
        }

        async function fetchProducts() {
            try {
                const res = await fetch(`${API_URL}?action=getProducts`);
                products = await res.json();
                renderProducts();
            } catch (err) { console.error(err); }
        }

        function renderProducts() {
            const container = document.getElementById('product-list');
            if (products.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-400 col-span-2 text-center py-6">Belum ada produk.</p>';
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
                    <img src="${p.img}" alt="${p.name}" class="w-full h-32 object-cover">
                    <div class="p-3 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="font-semibold text-sm text-gray-800 line-clamp-1">${p.name}</h3>
                            <p class="text-emerald-600 font-bold text-sm mt-1">Rp ${Number(p.price).toLocaleString('id-ID')}</p>
                        </div>
                        <div class="flex gap-1.5 mt-3">
                            <button onclick="addToCart('${p.id}')" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-medium text-xs py-2 rounded-lg transition">
                                + Tambah
                            </button>
                            <button onclick="shareProductImage('${p.id}')" class="bg-green-600 hover:bg-green-700 text-white px-2.5 py-2 rounded-lg text-xs transition" title="Bagikan Produk">
                                📤
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function shareProductImage(productId) {
            const p = products.find(prod => prod.id == productId);
            if (!p) return;

            document.getElementById('share-name').innerText = p.name;
            document.getElementById('share-price').innerText = `Rp ${Number(p.price).toLocaleString('id-ID')}`;
            document.getElementById('share-img').src = p.img;

            const cardElement = document.getElementById('product-share-card');
            cardElement.classList.remove('hidden');

            try {
                const canvas = await html2canvas(cardElement, { scale: 2, useCORS: true });
                cardElement.classList.add('hidden');

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], `${p.name.replace(/\s+/g, '-')}.png`, { type: 'image/png' });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                title: p.name,
                                text: `Yuk cek produk *${p.name}* seharga Rp ${Number(p.price).toLocaleString('id-ID')} di TOKO KITA!`,
                                files: [file],
                            });
                            return;
                        } catch (err) { console.log('Share dibatalkan', err); }
                    }

                    const link = document.createElement('a');
                    link.download = `${p.name}.png`;
                    link.href = URL.createObjectURL(blob);
                    link.click();

                    const textWa = `Halo TOKO KITA, saya tertarik dengan produk *${p.name}* (Rp ${Number(p.price).toLocaleString('id-ID')}). Apakah stoknya tersedia?`;
                    window.location.href = `https://wa.me/${OWNER_WA}?text=${encodeURIComponent(textWa)}`;
                }, 'image/png');
            } catch (error) {
                console.error("Gagal membuat gambar produk:", error);
                cardElement.classList.add('hidden');
            }
        }

        function addToCart(id) { cart[id] = (cart[id] || 0) + 1; updateCartUI(); }
        function updateCartUI() {
            let totalItems = 0, totalPrice = 0;
            for (let id in cart) {
                let p = products.find(prod => prod.id == id);
                if (p) { totalItems += cart[id]; totalPrice += Number(p.price) * cart[id]; }
            }
            const bar = document.getElementById('cart-bar');
            if (totalItems > 0) {
                bar.classList.remove('hidden');
                document.getElementById('cart-count').innerText = totalItems;
                document.getElementById('cart-total').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
            } else { bar.classList.add('hidden'); }
        }

        function openCheckoutModal() { document.getElementById('checkout-modal').classList.remove('hidden'); }
        function closeCheckoutModal() { document.getElementById('checkout-modal').classList.add('hidden'); }
        function openVendorModal() { document.getElementById('vendor-modal').classList.remove('hidden'); }
        function closeVendorModal() { document.getElementById('vendor-modal').classList.add('hidden'); }

        async function processCheckout() {
            const name = document.getElementById('buyer-name').value.trim();
            const phone = document.getElementById('buyer-phone').value.trim();
            const address = document.getElementById('buyer-address').value.trim();
            if (!name || !phone || !address) { alert('Mohon isi semua data.'); return; }

            let itemsArr = [];
            let totalPrice = 0;
            let receiptHtml = '';
            let textItems = '';

            for (let id in cart) {
                let p = products.find(prod => prod.id == id);
                let sub = Number(p.price) * cart[id];
                totalPrice += sub;
                itemsArr.push({ id: p.id, name: p.name, price: p.price, qty: cart[id] });
                receiptHtml += `<div class="flex justify-between"><span>${cart[id]}x ${p.name}</span><span>Rp ${sub.toLocaleString('id-ID')}</span></div>`;
                textItems += `- ${cart[id]}x ${p.name} (Rp ${sub.toLocaleString('id-ID')})
`;
            }

            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ type: "save_order", name, phone, address, items: itemsArr, total: totalPrice })
            });
            const result = await res.json();

            if (result.status === "success") {
                document.getElementById('r-name').innerText = name;
                document.getElementById('r-address').innerText = address;
                document.getElementById('receipt-items').innerHTML = receiptHtml;
                document.getElementById('r-total').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;

                const receipt = document.getElementById('receipt-area');
                receipt.classList.remove('hidden');
                const canvas = await html2canvas(receipt, { scale: 2 });
                receipt.classList.add('hidden');

                canvas.toBlob((blob) => {
                    const link = document.createElement('a');
                    link.download = `Nota-${result.orderId}.png`;
                    link.href = URL.createObjectURL(blob);
                    link.click();

                    const adminUrl = `${getBaseUrl()}/admin.html?type=order&id=${result.orderId}`;
                    const textWa = `Halo TOKO KITA, saya mau pesan:

${textItems}
*Total: Rp ${totalPrice.toLocaleString('id-ID')}*

*Nama:* ${name}
*Alamat:* ${address}

Link Konfirmasi Admin:
${adminUrl}`;
                    window.location.href = `https://wa.me/${OWNER_WA}?text=${encodeURIComponent(textWa)}`;
                });
            }
        }

        async function submitVendorRegistration() {
            const name = document.getElementById('v-name').value.trim();
            const phone = document.getElementById('v-phone').value.trim();
            if (!name || !phone) { alert('Mohon isi semua data.'); return; }

            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ type: "register_vendor", name, phone })
            });
            const result = await res.json();

            if (result.status === "success") {
                document.getElementById('vr-name').innerText = name;
                const receipt = document.getElementById('vendor-receipt-area');
                receipt.classList.remove('hidden');
                const canvas = await html2canvas(receipt, { scale: 2 });
                receipt.classList.add('hidden');

                canvas.toBlob((blob) => {
                    const link = document.createElement('a');
                    link.download = `Pendaftaran-${result.token}.png`;
                    link.href = URL.createObjectURL(blob);
                    link.click();

                    const adminUrl = `${getBaseUrl()}/admin.html?type=vendor&id=${result.token}`;
                    const textWa = `Halo TOKO KITA, saya ingin mendaftar sebagai kontributor.
*Nama:* ${name}
*No WA:* ${phone}

Link Admin:
${adminUrl}`;
                    window.location.href = `https://wa.me/${OWNER_WA}?text=${encodeURIComponent(textWa)}`;
                });
            }
        }

        fetchProducts();
    </script>
</body>
</html>
