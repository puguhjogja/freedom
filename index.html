<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Maps & WA Blaster PWA</title>
    <meta name="theme-color" content="#25D366">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --subtext-color: #666666;
            --border-color: #ddd;
            --accent-color: #25D366;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --subtext-color: #aaaaaa;
            --border-color: #333;
            --accent-color: #2ea44f;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            position: relative;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 8px;
        }
        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-admin { background: #007bff; }
        .btn-maps { background: #4285F4; }
        .btn-danger { background: #e74c3c; }
        .btn-theme {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
            position: absolute;
            top: 20px;
            right: 20px;
            margin: 0;
            border-radius: 6px;
        }
        .hidden { display: none !important; }
        .info { font-size: 13px; color: var(--subtext-color); margin-bottom: 15px; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-box {
            background: rgba(0,0,0,0.03);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        [data-theme="dark"] .stat-box { background: rgba(255,255,255,0.05); }
        .stat-num { font-size: 18px; font-weight: bold; color: var(--accent-color); }
        .stat-label { font-size: 11px; color: var(--subtext-color); margin-top: 4px; }

        .history-box {
            background: rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            text-align: left;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        [data-theme="dark"] .history-box { background: rgba(255,255,255,0.03); }

        #expired-box {
            background: rgba(255, 235, 238, 0.9);
            border: 1px solid #ffcdd2;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        #expired-box p { color: #c62828; }
    </style>
</head>
<body>

    <div class="card">
        <button class="btn-theme" onclick="toggleTheme()">🌓 Tema</button>

        <!-- HALAMAN LOGIN -->
        <div id="login-section">
            <h2>🔒 Portal Akses</h2>
            <p class="info">Masukkan email terdaftar Anda untuk masuk ke aplikasi.</p>
            <input type="email" id="user-email" placeholder="nama@email.com">
            <button id="btn-login" onclick="handleLogin()">Masuk / Cek Akun</button>

            <div id="expired-box">
                <p id="expired-msg"></p>
                <button class="btn-admin" onclick="contactAdmin()">💬 Hubungi Admin via WhatsApp</button>
            </div>
        </div>

        <!-- HALAMAN UTAMA / DASHBOARD -->
        <div id="app-section" class="hidden">
            <h2>📊 Dashboard Lead</h2>
            <p class="info" id="welcome-msg" style="margin-bottom:10px;"></p>

            <div class="dashboard-grid">
                <div class="stat-box">
                    <div class="stat-num" id="quota-display">-</div>
                    <div class="stat-label">Sisa Kuota Ekstraksi</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" style="color:#4285F4;" id="expiry-display">-</div>
                    <div class="stat-label">Masa Aktif Akun</div>
                </div>
            </div>

            <div style="font-size:13px; font-weight:bold; text-align:left; margin-bottom:5px;">📜 Riwayat Aktivitas Terakhir:</div>
            <div class="history-box" id="history-list">
                <div>• Belum ada aktivitas ekstraksi sesi ini.</div>
            </div>

            <button class="btn-maps" onclick="openGoogleMaps()">📍 Buka Google Maps & Ekstrak</button>
            <button class="btn-danger" onclick="logout()">Keluar Akun</button>
        </div>
    </div>

    <script>
        // ==== KONFIGURASI ====
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwVN16r0PUQHrZl1PyD34yASIpzlsszLzXIDn4T7mQbbFjAqni1uqhN4uttng_4wSgi5A/exec";
        const ADMIN_PHONE = "6289653135369";

        // ==== TEMA ====
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        // ==== UTIL FETCH ====
        function jsonFetch(payload) {
            return fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).then(function (r) { return r.json(); });
        }

        // ==== LOGIN ====
        function handleLogin() {
            const emailInput = document.getElementById('user-email').value.trim();
            if (!emailInput || emailInput.indexOf('@') === -1) {
                alert('Masukkan alamat email yang valid!');
                return;
            }
            doLogin(emailInput);
        }

        function doLogin(email) {
            const btn = document.getElementById('btn-login');
            btn.innerText = 'Memeriksa...';
            btn.disabled = true;
            document.getElementById('expired-box').style.display = 'none';

            jsonFetch({ action: "registerOrLogin", email: email })
                .then(function (data) {
                    btn.innerText = 'Masuk / Cek Akun';
                    btn.disabled = false;

                    if (data.status === "expired") {
                        document.getElementById('expired-msg').innerHTML =
                            '⚠️ <b>MASA AKTIF HABIS!</b><br>' + data.message;
                        document.getElementById('expired-box').style.display = 'block';
                    } else if (data.status === "success") {
                        localStorage.setItem('user_email', email);
                        showDashboard(email, data.expiry, data.quota);
                    } else {
                        alert('Gagal: ' + (data.message || 'Unknown error'));
                    }
                })
                .catch(function (err) {
                    btn.innerText = 'Masuk / Cek Akun';
                    btn.disabled = false;
                    alert('Tidak dapat terhubung ke server.\n' + err.message +
                        '\n\nCek: WEB_APP_URL sudah benar & deploy "Anyone".');
                });
        }

        // ==== DASHBOARD ====
        function showDashboard(email, expiry, quota) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = 'Halo, ' + email;
            document.getElementById('expiry-display').innerText = expiry;
            document.getElementById('quota-display').innerText = quota;
            loadHistoryToUI(email);
        }

        function loadHistoryToUI(email) {
            const key = 'history_' + email;
            const saved = JSON.parse(localStorage.getItem(key) || '[]');
            const container = document.getElementById('history-list');

            if (saved.length === 0) {
                container.innerHTML = '<div>• Belum ada aktivitas ekstraksi sesi ini.</div>';
                return;
            }
            container.innerHTML = '';
            saved.slice(-20).reverse().forEach(function (item) {
                const div = document.createElement('div');
                div.style.marginBottom = '4px';
                div.innerHTML = '• [' + item.time + '] Berhasil ekstrak <b>' + item.count + ' kontak</b>';
                container.appendChild(div);
            });
        }

        function addHistory(email, count) {
            const key = 'history_' + email;
            const saved = JSON.parse(localStorage.getItem(key) || '[]');
            saved.push({ time: new Date().toLocaleString('id-ID'), count: count });
            localStorage.setItem(key, JSON.stringify(saved.slice(-20)));
        }

        // ==== ADMIN ====
        function contactAdmin() {
            const emailInput = document.getElementById('user-email').value.trim();
            const text = 'Halo Admin, akun Lead Maps saya kedaluwarsa.\nEmail: *' +
                emailInput + '*\nMohon bantu perpanjang masa aktif.';
            window.open('https://api.whatsapp.com/send?phone=' + ADMIN_PHONE +
                '&text=' + encodeURIComponent(text), '_blank');
        }

        // ==== EKSTRAKSI ====
        function openGoogleMaps() {
            window.open('https://www.google.com/maps', '_blank');

            const email = localStorage.getItem('user_email');
            if (!email) return;

            const demoLeads = [
                { name: "Toko Contoh A", phone: "628111111111" },
                { name: "Toko Contoh B", phone: "628222222222" }
            ];

            jsonFetch({ action: "saveLeads", email: email, leads: demoLeads })
                .then(function (res) {
                    if (res.status === 'success') {
                        addHistory(email, res.total);
                        alert('Berhasil menyimpan ' + res.total + ' lead.');
                        // refresh kuota
                        jsonFetch({ action: "registerOrLogin", email: email })
                            .then(function (d) {
                                if (d.status === 'success') {
                                    document.getElementById('quota-display').innerText = d.quota;
                                    loadHistoryToUI(email);
                                }
                            });
                    } else {
                        alert('Gagal simpan: ' + res.message);
                    }
                })
                .catch(function (err) { alert('Error: ' + err.message); });
        }

        function logout() {
            localStorage.removeItem('user_email');
            location.reload();
        }

        // ==== INIT ====
        document.addEventListener('DOMContentLoaded', function () {
            document.documentElement.setAttribute(
                'data-theme',
                localStorage.getItem('theme') || 'light'
            );

            const savedEmail = localStorage.getItem('user_email');
            if (savedEmail) {
                document.getElementById('user-email').value = savedEmail;
                doLogin(savedEmail);
            }
        });
    </script>
</body>
</html>
