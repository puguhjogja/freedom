<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Penjual — TOKO KITA</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:#18312f;font-family:system-ui,Arial}.login{max-width:390px;margin:12vh auto;background:white;padding:28px;border-radius:20px;box-shadow:0 15px 50px #123b3815}.login h1{color:#0f766e;margin-top:0}.login input,.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #dce8e4;border-radius:10px;margin:7px 0;font:inherit}.btn{background:#0f766e;color:white;border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.btn.alt{background:#e8f7f3;color:#0f766e}.btn.warn{background:#f59e0b}.btn.danger{background:#b94343}.app{display:none}.bar{background:#123b38;color:white;padding:18px 4%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}.main{max-width:1100px;margin:25px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.box{background:white;border-radius:16px;padding:18px;box-shadow:0 5px 20px #123b3808}.stat b{font-size:26px;color:#0f766e}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}.tab{border:0;border-radius:9px;padding:10px 15px;background:#e2eeea;white-space:nowrap;cursor:pointer}.tab.active{background:#0f766e;color:white}.box{margin:14px 0;overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e8efec;font-size:13px}th{color:#70817d}.field{margin:10px 0}.field label{font-size:13px;font-weight:700;display:block;margin-bottom:4px}.muted{font-size:12px;color:#70817d}.gridform{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}.b-promo{background:#fef3c7;color:#92400e}.b-unlimited{background:#e8f7f3;color:#0f766e}.b-expired{background:#fee2e2;color:#b91c1c}.b-pending{background:#fef9c3;color:#854d0e}.price-old{text-decoration:line-through;color:#9ca3af;font-size:12px}.price-new{color:#dc2626;font-weight:800}.full{grid-column:1/-1}.note{background:#f0fdfa;border-left:4px solid #0f766e;padding:10px 14px;border-radius:8px;font-size:13px;margin:10px 0}.hidden{display:none}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.gridform{grid-template-columns:1fr}}
</style></head><body>
<div class="login" id="login"><h1>TOKO KITA · Penjual</h1><p>Masuk dengan kode akses yang dikirim admin via WhatsApp.</p><input id="code" placeholder="Contoh: TKAB12CD"><button class="btn" style="width:100%" onclick="login()">Masuk</button><p class="muted">Belum punya kode? Daftar sebagai penjual di halaman toko lalu tunggu approval admin.</p></div>

<div class="app" id="app">
  <div class="bar"><b>🏪 <span id="sellerName">Penjual</span></b><div><button class="btn alt" onclick="logout()">Keluar</button></div></div>
  <main class="main">
    <div class="stats" id="stats"></div>
    <div class="tabs">
      <button class="tab active" onclick="tab('products',this)">Produk Saya</button>
      <button class="tab" onclick="tab('add',this)">+ Tambah Produk</button>
      <button class="tab" onclick="tab('orders',this)">Pesanan Masuk</button>
    </div>
    <section id="content"></section>
  </main>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbzEaBixsZs-TtzPnhMj_0tp0DauJrTvn-umDiovCyJvQXY59C1fbmqZbPU0JM68qyhC/exec';
let token=sessionStorage.getItem('tk_seller')||'', data={};
function api(action,payload={}){return new Promise((resolve,reject)=>{let cb='sl'+Date.now()+Math.floor(Math.random()*1000),s=document.createElement('script'),t=setTimeout(()=>{clean();reject(Error('Server timeout'))},18000);function clean(){delete window[cb];s.remove();clearTimeout(t)}window[cb]=r=>{clean();r.ok?resolve(r.data):reject(Error(r.error||'Gagal'))};s.onerror=()=>{clean();reject(Error('Koneksi gagal'))};s.src=API+'?action='+encodeURIComponent(action)+'&data='+encodeURIComponent(JSON.stringify({...payload,token}))+'&callback='+cb;document.body.appendChild(s)})}
async function login(){try{let r=await api('sellerLogin',{accessCode:document.getElementById('code').value});token=r.token;sessionStorage.setItem('tk_seller',token);show();}catch(e){alert(e.message)}}
function logout(){token='';sessionStorage.removeItem('tk_seller');location.reload()}
async function show(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';await refresh();document.getElementById('sellerName').textContent=data.seller.name;tab('products',document.querySelector('.tab'));}
async function refresh(){data=await api('sellerData');renderStats()}
function renderStats(){let s=data;let promoAktif=s.products.filter(p=>p.promoActive).length;let totalPesanan=s.orders.length;let totalPendapatan=s.orders.reduce((a,o)=>a+o.items.reduce((x,it)=>x+Number(it.subtotal||0),0),0);document.getElementById('stats').innerHTML=[['Total Produk',s.products.length],['Promo Aktif',promoAktif],['Pesanan',totalPesanan],['Pendapatan',money(totalPendapatan)]].map(x=>`<div class="stat"><div class="muted">${x[0]}</div><b>${x[1]}</b></div>`).join('')}
function tab(name,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el?.classList.add('active');let c=document.getElementById('content');if(name==='products')c.innerHTML=productsView();if(name==='add')c.innerHTML=addView();if(name==='orders')c.innerHTML=ordersView();}
const money=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function productsView(){return `<div class="box"><h3>Produk Saya</h3><table><tr><th>Produk</th><th>Harga</th><th>Masa Aktif</th><th>Status</th><th>Aksi</th></tr>${data.products.map(p=>{let badge=p.promoActive?'<span class="badge b-promo">🔥 Promo Aktif</span>':p.promoExpired?'<span class="badge b-expired">Promo Berakhir</span>':p.isPromo?'<span class="badge b-pending">Promo Terjadwal</span>':'<span class="badge b-unlimited">∞ Tak Terbatas</span>';let price=p.promoActive?`<span class="price-old">${money(p.price)}</span> <span class="price-new">${money(p.promoPrice)}</span>`:money(p.price);let periode=p.isPromo?`<div class="muted">${esc(p.promoStart)} → ${esc(p.promoEnd)}</div>`:'<div class="muted">Selamanya</div>';return `<tr><td>${esc(p.name)}<div class="muted">${esc(p.category||'')}</div></td><td>${price}</td><td>${badge}${periode}</td><td>${esc(p.status)}</td><td><div class="actions"><button class="btn alt" onclick="toggleProduct('${esc(p.id)}','${esc(p.status)}')">${p.status==='Aktif'?'Nonaktifkan':'Aktifkan'}</button> <button class="btn danger" onclick="delProduct('${esc(p.id)}')">Hapus</button></div></td></tr>`;}).join('')||'<tr><td colspan="5">Belum ada produk. Tambah produk pertama Anda.</td></tr>'}</table></div>`}
function addView(){return `<div class="box"><h3>Tambah Produk Baru</h3><div class="note">💡 <b>Masa aktif promo:</b> pilih "Promo" untuk harga diskon dengan periode tertentu. Pilih "Tak Terbatas" agar produk tampil terus tanpa batas waktu.</div><div class="gridform"><div class="field full"><label>Nama produk *</label><input id="pn"></div><div class="field"><label>Harga normal *</label><input id="pp" type="number"></div><div class="field"><label>Kategori</label><input id="pc" value="${esc(data.seller.category||'')}"></div><div class="field full"><label>URL foto produk</label><input id="pi" placeholder="https://..."></div><div class="field full"><label>Deskripsi</label><textarea id="pd" rows="2"></textarea></div><div class="field full"><label>Masa Aktif Produk</label><select id="pactiveType" onchange="togglePromoFields()"><option value="unlimited">∞ Tak Terbatas (tampil selamanya)</option><option value="promo">🔥 Promo (harga khusus periode tertentu)</option></select></div><div class="field full hidden" id="promoBox"><label>Harga promo</label><input id="ppromo" type="number" placeholder="Harga setelah diskon"><label>Tanggal mulai promo</label><input id="pstart" type="date"><label>Tanggal berakhir promo</label><input id="pend" type="date"></div></div><button class="btn" style="margin-top:10px" onclick="saveProduct()">Simpan Produk</button></div>`}
function togglePromoFields(){let v=document.getElementById('pactiveType').value;document.getElementById('promoBox').classList.toggle('hidden',v!=='promo');}
async function saveProduct(){let p={name:document.getElementById('pn').value,price:document.getElementById('pp').value,category:document.getElementById('pc').value,image:document.getElementById('pi').value,description:document.getElementById('pd').value,activeType:document.getElementById('pactiveType').value};if(p.activeType==='promo'){p.promoPrice=document.getElementById('ppromo').value;p.promoStart=document.getElementById('pstart').value;p.promoEnd=document.getElementById('pend').value;}try{await api('sellerSaveProduct',{product:p});await refresh();alert('Produk berhasil ditambahkan.');tab('products',document.querySelectorAll('.tab')[0]);}catch(e){alert(e.message)}}
async function toggleProduct(id,status){try{await api('sellerToggleProduct',{id,status});await refresh();tab('products',document.querySelectorAll('.tab')[0]);}catch(e){alert(e.message)}}
async function delProduct(id){if(!confirm('Hapus produk ini?'))return;try{await api('sellerDeleteProduct',{id});await refresh();tab('products',document.querySelectorAll('.tab')[0]);}catch(e){alert(e.message)}}
function ordersView(){return `<div class="box"><h3>Pesanan Masuk (produk Anda)</h3><table><tr><th>No. Pesanan</th><th>Pembeli</th><th>Item Anda</th><th>Subtotal</th><th>Status</th></tr>${data.orders.map(o=>{let sub=o.items.reduce((a,it)=>a+Number(it.subtotal||0),0);return `<tr><td>${esc(o.id)}<div class="muted">${esc(o.date)}</div></td><td>${esc(o.buyerName)}<div class="muted">${esc(o.phone)}</div></td><td>${o.items.map(it=>`${esc(it.name)} ×${it.qty}`).join('<br>')}</td><td>${money(sub)}</td><td>${esc(o.status)}</td></tr>`;}).join('')||'<tr><td colspan="5">Belum ada pesanan untuk produk Anda.</td></tr>'}</table></div>`}
if(token)show();
</script></body></html>
