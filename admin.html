<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin TOKO KITA</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:#18312f;font-family:system-ui,Arial}.login{max-width:390px;margin:12vh auto;background:white;padding:28px;border-radius:20px;box-shadow:0 15px 50px #123b3815}.login h1{color:#0f766e;margin-top:0}.login input,.field input,.field select{width:100%;padding:12px;border:1px solid #dce8e4;border-radius:10px;margin:7px 0}.btn{background:#0f766e;color:white;border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.btn.alt{background:#e8f7f3;color:#0f766e}.app{display:none}.bar{background:#123b38;color:white;padding:18px 4%;display:flex;justify-content:space-between;align-items:center}.main{max-width:1200px;margin:25px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.box{background:white;border-radius:16px;padding:18px;box-shadow:0 5px 20px #123b3808}.stat b{font-size:26px;color:#0f766e}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}.tab{border:0;border-radius:9px;padding:10px 15px;background:#e2eeea;white-space:nowrap}.tab.active{background:#0f766e;color:white}.box{margin:14px 0;overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e8efec;font-size:13px}th{color:#70817d}.field{margin:8px 0}.field label{font-size:13px;font-weight:700}.muted{font-size:12px;color:#70817d}.hidden{display:none}.actions{display:flex;gap:6px;flex-wrap:wrap}.danger{background:#b94343;color:white}.gridform{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.gridform{grid-template-columns:1fr}.bar{padding:15px}}
</style></head><body>
<div class="login" id="login"><h1>TOKO KITA</h1><p>Masuk ke Dashboard Admin</p><input id="pin" type="password" placeholder="Password admin"><button class="btn" style="width:100%" onclick="login()">Masuk</button><p class="muted">Password admin diverifikasi oleh Google Apps Script.</p></div>
<div class="app" id="app"><div class="bar"><b>🛍️ TOKO KITA · ADMIN</b><button class="btn alt" onclick="logout()">Keluar</button></div><main class="main"><div class="stats" id="stats"></div><div class="tabs"><button class="tab active" onclick="tab('orders',this)">Pesanan</button><button class="tab" onclick="tab('sellers',this)">Penjual</button><button class="tab" onclick="tab('products',this)">Produk</button><button class="tab" onclick="tab('settings',this)">Pengaturan</button></div><section id="content"></section></main></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxMgM-4pPOwGEXbLx2IjVYArNMJGpfSLx_c9uI7mjtiabxKzrbzMDoTp98S0Xn4wvBj/exec';let token=sessionStorage.getItem('tk_admin')||'',data={};
function api(action,payload={}){return new Promise((resolve,reject)=>{let cb='adm'+Date.now()+Math.floor(Math.random()*1000),s=document.createElement('script'),t=setTimeout(()=>{clean();reject(Error('Server timeout'))},18000);function clean(){delete window[cb];s.remove();clearTimeout(t)}window[cb]=r=>{clean();r.ok?resolve(r.data):reject(Error(r.error||'Gagal'))};s.onerror=()=>{clean();reject(Error('Koneksi gagal'))};s.src=API+'?action='+encodeURIComponent(action)+'&data='+encodeURIComponent(JSON.stringify({...payload,token}))+'&callback='+cb;document.body.appendChild(s)})}
async function login(){try{let r=await api('adminLogin',{password:document.getElementById('pin').value});token=r.token;sessionStorage.setItem('tk_admin',token);show()}catch(e){alert(e.message)}}
function logout(){token='';sessionStorage.removeItem('tk_admin');location.reload()}
async function show(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';await refresh();tab('orders',document.querySelector('.tab'))}
async function refresh(){data=await api('adminData');let s=data;document.getElementById('stats').innerHTML=[['Pesanan',s.orders.length],['Penjual',s.sellers.length],['Produk',s.products.length],['Menunggu konfirmasi',s.orders.filter(x=>x.status!=='Dikonfirmasi').length]].map(x=>`<div class="stat"><div class="muted">${x[0]}</div><b>${x[1]}</b></div>`).join('')}
function tab(name,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el?.classList.add('active');let c=document.getElementById('content');if(name==='orders')c.innerHTML=ordersView();if(name==='sellers')c.innerHTML=sellersView();if(name==='products')c.innerHTML=productsView();if(name==='settings')c.innerHTML=settingsView()}
const money=n=>'Rp'+Number(n||0).toLocaleString('id-ID'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ordersView(){return `<div class="box"><h3>Daftar Pesanan</h3><table><tr><th>No. Pesanan</th><th>Pembeli</th><th>Total</th><th>Status</th><th>Aksi</th></tr>${data.orders.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.buyerName)}<br><span class="muted">${esc(o.phone)}</span></td><td>${money(o.total)}</td><td>${esc(o.status)}</td><td><div class="actions"><button class="btn" onclick="confirmOrder('${esc(o.id)}')">Konfirmasi & Kirim Nota</button><button class="btn alt" onclick="viewOrder('${esc(o.id)}')">Detail</button></div></td></tr>`).join('')||'<tr><td colspan="5">Belum ada pesanan.</td></tr>'}</table></div>`}
function sellersView(){return `<div class="box"><h3>Manajemen Penjual</h3><table><tr><th>Nama</th><th>WhatsApp</th><th>Kategori</th><th>Status</th><th>Masa aktif</th><th>Aksi</th></tr>${data.sellers.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td>${esc(s.category)}</td><td>${esc(s.status)}</td><td>${esc(s.expiry||'-')}</td><td><div class="actions"><button class="btn" onclick="approve('${esc(s.id)}')">Setujui</button><button class="btn alt" onclick="setExpiry('${esc(s.id)}')">Atur masa aktif</button><button class="btn alt" onclick="contactSeller('${esc(s.id)}')">WhatsApp</button></div></td></tr>`).join('')||'<tr><td colspan="6">Belum ada pendaftaran.</td></tr>'}</table></div>`}
function productsView(){return `<div class="box"><h3>Tambah Produk</h3><div class="gridform"><div class="field"><label>Nama produk</label><input id="pn"></div><div class="field"><label>Harga (angka)</label><input id="pp" type="number"></div><div class="field"><label>Kategori</label><input id="pc"></div><div class="field"><label>Nama penjual</label><input id="ps"></div><div class="field"><label>URL foto produk</label><input id="pi"></div><div class="field"><label>Deskripsi</label><input id="pd"></div></div><button class="btn" onclick="saveProduct()">Simpan Produk</button></div><div class="box"><h3>Produk Aktif</h3><table><tr><th>Produk</th><th>Penjual</th><th>Harga</th><th>Aksi</th></tr>${data.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sellerName)}</td><td>${money(p.price)}</td><td><button class="btn danger" onclick="delProduct('${esc(p.id)}')">Hapus</button></td></tr>`).join('')}</table></div>`}
function settingsView(){let s=data.settings||{};return `<div class="box"><h3>Pengaturan Toko</h3><div class="field"><label>Nomor WhatsApp Admin (format 628xxx)</label><input id="wa" value="${esc(s.adminPhone||'')}"></div><div class="field"><label>Nama pemilik rekening</label><input id="holder" value="${esc(s.bankHolder||'')}"></div><div class="field"><label>Nama bank</label><input id="bank" value="${esc(s.bankName||'')}"></div><div class="field"><label>Nomor rekening</label><input id="account" value="${esc(s.bankAccount||'')}"></div><button class="btn" onclick="saveSettings()">Simpan Pengaturan</button></div>`}
async function act(a,p){try{await api(a,p);await refresh();alert('Berhasil diperbarui.')}catch(e){alert(e.message)}}
async function approve(id){let s=data.sellers.find(x=>x.id===id);let days=prompt('Masa aktif dalam hari:', '30');if(days===null)return;let expiry=new Date(Date.now()+Number(days)*86400000).toISOString().slice(0,10);await api('updateSeller',{id,status:'Aktif',expiry});await refresh();let msg=`PENDAFTARAN PENJUAL DISETUJUI — TOKO KITA\nHalo ${s.name}, pendaftaran Anda telah disetujui.\nMasa aktif sampai: ${expiry}\n\nInformasi pembayaran biaya/aktivasi:\nBank: ${data.settings.bankName||'-'}\nNo. Rekening: ${data.settings.bankAccount||'-'}\nAtas nama: ${data.settings.bankHolder||'-'}\n\nSilakan lakukan pembayaran dan kirim bukti kepada admin.`;wa(s.phone,msg)}
async function setExpiry(id){let s=data.sellers.find(x=>x.id===id),d=prompt('Tanggal akhir masa aktif (YYYY-MM-DD):',s.expiry||'');if(d===null)return;await act('updateSeller',{id,expiry:d,status:'Aktif'})}
function contactSeller(id){let s=data.sellers.find(x=>x.id===id);wa(s.phone,`Halo ${s.name}, ini admin TOKO KITA.`)}
async function confirmOrder(id){let o=data.orders.find(x=>x.id===id);await api('confirmOrder',{id});await refresh();let msg=`NOTA PEMBELIAN TOKO KITA\nNo: ${o.id}\nTanggal: ${o.date}\nPembeli: ${o.buyerName}\n${o.items.map(x=>`${x.name} x${x.qty} — ${money(x.subtotal)}`).join('\n')}\nTOTAL: ${money(o.total)}\nStatus: DIKONFIRMASI\nTerima kasih telah berbelanja di TOKO KITA.`;wa(o.phone,msg)}
function viewOrder(id){let o=data.orders.find(x=>x.id===id);alert(`Pesanan ${o.id}\n${o.items.map(x=>x.name+' x'+x.qty).join('\n')}\nTotal: ${money(o.total)}\nAlamat: ${o.address}`)}
async function saveProduct(){await act('saveProduct',{product:{name:pn.value,price:pp.value,category:pc.value,sellerName:ps.value,image:pi.value,description:pd.value}});tab('products',document.querySelectorAll('.tab')[2])}
async function delProduct(id){if(confirm('Hapus produk ini?')){await act('deleteProduct',{id});tab('products',document.querySelectorAll('.tab')[2])}}
async function saveSettings(){await act('saveSettings',{settings:{adminPhone:wa.value,bankHolder:holder.value,bankName:bank.value,bankAccount:account.value}})}
function wa(phone,msg){window.open('https://wa.me/'+String(phone).replace(/\D/g,'').replace(/^0/,'62')+'?text='+encodeURIComponent(msg),'_blank')}
if(token)show();
</script></body></html>
