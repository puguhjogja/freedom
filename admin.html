<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin TOKO KITA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:#18312f;font-family:system-ui,Arial}.login{max-width:390px;margin:12vh auto;background:white;padding:28px;border-radius:20px;box-shadow:0 15px 50px #123b3815}.login h1{color:#0f766e;margin-top:0}.login input,.field input,.field select{width:100%;padding:12px;border:1px solid #dce8e4;border-radius:10px;margin:7px 0}.btn{background:#0f766e;color:white;border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.btn.alt{background:#e8f7f3;color:#0f766e}.app{display:none}.bar{background:#123b38;color:white;padding:18px 4%;display:flex;justify-content:space-between;align-items:center}.main{max-width:1200px;margin:25px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.box{background:white;border-radius:16px;padding:18px;box-shadow:0 5px 20px #123b3808}.stat b{font-size:26px;color:#0f766e}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}.tab{border:0;border-radius:9px;padding:10px 15px;background:#e2eeea;white-space:nowrap}.tab.active{background:#0f766e;color:white}.box{margin:14px 0;overflow:auto}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e8efec;font-size:13px}th{color:#70817d}.field{margin:8px 0}.field label{font-size:13px;font-weight:700}.muted{font-size:12px;color:#70817d}.hidden{display:none}.actions{display:flex;gap:6px;flex-wrap:wrap}.danger{background:#b94343;color:white}.gridform{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field input,.field select{display:block}.formactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.gridform{grid-template-columns:1fr}.bar{padding:15px}}
</style>
</head>
<body>
<div class="login" id="login">
  <h1>TOKO KITA</h1>
  <p>Masuk ke Dashboard Admin</p>
  <input id="pin" type="password" placeholder="Password admin" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" style="width:100%" onclick="login()">Masuk</button>
  <p class="muted">Password admin diverifikasi oleh Google Apps Script.</p>
</div>

<div class="app" id="app">
  <div class="bar"><b>🛍️ TOKO KITA · ADMIN</b><button class="btn alt" onclick="logout()">Keluar</button></div>
  <main class="main">
    <div class="stats" id="stats"></div>
    <div class="tabs">
      <button class="tab active" onclick="tab('orders',this)">Pesanan</button>
      <button class="tab" onclick="tab('sellers',this)">Penjual</button>
      <button class="tab" onclick="tab('products',this)">Produk</button>
      <button class="tab" onclick="tab('settings',this)">Pengaturan</button>
    </div>
    <section id="content"></section>
  </main>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwDFNmqLXVInE3h-sDPqDzVibqtQdfM7DRz6OSi9q2-s4winFgBg0YsH6xPVW72q47u/exec';
let token = sessionStorage.getItem('tk_admin') || '', data = {};

function api(action, payload = {}) {
  return new Promise((resolve, reject) => {
    let cb = 'adm' + Date.now() + Math.floor(Math.random() * 1000),
        s = document.createElement('script'),
        t = setTimeout(() => { clean(); reject(Error('Server timeout')); }, 18000);
    function clean() { delete window[cb]; s.remove(); clearTimeout(t); }
    window[cb] = r => { clean(); r.ok ? resolve(r.data) : reject(Error(r.error || 'Gagal')); };
    s.onerror = () => { clean(); reject(Error('Koneksi gagal')); };
    s.src = API + '?action=' + encodeURIComponent(action) + '&data=' + encodeURIComponent(JSON.stringify({ ...payload, token })) + '&callback=' + cb;
    document.body.appendChild(s);
  });
}

async function login() {
  try {
    let r = await api('adminLogin', { password: document.getElementById('pin').value });
    token = r.token;
    sessionStorage.setItem('tk_admin', token);
    show();
  } catch (e) {
    alert(e.message);
  }
}

function logout() {
  token = '';
  sessionStorage.removeItem('tk_admin');
  location.reload();
}

async function show() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await refresh();
  tab('orders', document.querySelector('.tab'));
}

async function refresh() {
  data = await api('adminData');
  let s = data;
  document.getElementById('stats').innerHTML = [
    ['Pesanan', s.orders.length],
    ['Penjual', s.sellers.length],
    ['Produk', s.products.length],
    ['Menunggu konfirmasi', s.orders.filter(x => x.status !== 'Dikonfirmasi').length]
  ].map(x => `<div class="stat"><div class="muted">${x[0]}</div><b>${x[1]}</b></div>`).join('');
}

function tab(name, el) {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  el?.classList.add('active');
  let c = document.getElementById('content');
  if (name === 'orders') c.innerHTML = ordersView();
  if (name === 'sellers') c.innerHTML = sellersView();
  if (name === 'products') c.innerHTML = productsView();
  if (name === 'settings') c.innerHTML = settingsView();
}

const money = n => 'Rp' + Number(n || 0).toLocaleString('id-ID');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function ordersView() {
  return `<div class="box"><h3>Daftar Pesanan</h3><table><tr><th>No. Pesanan</th><th>Pembeli</th><th>Total</th><th>Status</th><th>Aksi</th></tr>${data.orders.map(o => `<tr><td>${esc(o.id)}</td><td>${esc(o.buyerName)}<br><span class="muted">${esc(o.phone)}</span></td><td>${money(o.total)}</td><td>${esc(o.status)}</td><td><div class="actions"><button class="btn" onclick="confirmOrder('${esc(o.id)}')">Konfirmasi & Kirim Nota</button><button class="btn alt" onclick="viewOrder('${esc(o.id)}')">Detail</button></div></td></tr>`).join('') || '<tr><td colspan="5">Belum ada pesanan.</td></tr>'}</table></div>`;
}

function sellersView() {
  return `
    <div class="box">
      <h3 id="sellerFormTitle">Tambah Penjual Baru</h3>
      <input type="hidden" id="sellerId">
      <div class="gridform">
        <div class="field"><label>Nama lengkap / toko *</label><input id="sname" placeholder="Contoh: Toko Berkah"></div>
        <div class="field"><label>Nomor WhatsApp * (08xxx atau 628xxx)</label><input id="sphone" inputmode="tel" placeholder="08xxxxxxxxxx"></div>
        <div class="field"><label>Alamat / kota</label><input id="saddress" placeholder="Yogyakarta"></div>
        <div class="field"><label>Kategori / jenis produk</label><input id="scategory" placeholder="Makanan, Fashion, dll"></div>
        <div class="field"><label>Password login penjual *</label><input id="spass" type="password" placeholder="Minimal 6 karakter (kosongkan saat edit jika tidak diubah)"></div>
        <div class="field"><label>Status akun</label><select id="sstatus"><option value="Aktif">Aktif</option><option value="Menunggu">Menunggu</option><option value="Nonaktif">Nonaktif</option></select></div>
        <div class="field"><label>Masa aktif sampai (opsional)</label><input id="sexpiry" type="date"></div>
        <div class="field"><label>Catatan</label><input id="snote" placeholder="Catatan tambahan"></div>
      </div>
      <div class="formactions">
        <button class="btn" onclick="saveSeller()">Simpan Penjual</button>
        <button class="btn alt hidden" id="cancelSellerEdit" onclick="resetSellerForm()">Batal Edit</button>
      </div>
      <p class="muted">Nomor WhatsApp otomatis diformat ke 628xxx dan digunakan penjual untuk login di portal penjual.</p>
    </div>

    <div class="box">
      <h3>Daftar Penjual</h3>
      <table>
        <tr><th>Kode Toko</th><th>Nama</th><th>WhatsApp</th><th>Kategori</th><th>Status</th><th>Masa aktif</th><th>Aksi</th></tr>
        ${data.sellers.map(s => `<tr>
          <td><b>${esc(s.storeCode || ('TK-' + String(s.id).slice(0, 8).toUpperCase()))}</b></td>
          <td>${esc(s.name)}<br><span class="muted">${esc(s.address || '')}</span></td>
          <td>${esc(s.phone)}</td>
          <td>${esc(s.category || '-')}</td>
          <td>${esc(s.status)}</td>
          <td>${esc(s.expiry || 'Tidak dibatasi')}</td>
          <td>
            <div class="actions">
              ${s.status !== 'Aktif' ? `<button class="btn" onclick="approve('${esc(s.id)}')">Setujui</button>` : ''}
              <button class="btn alt" onclick="editSeller('${esc(s.id)}')">Edit</button>
              <button class="btn alt" onclick="contactSeller('${esc(s.id)}')">WhatsApp</button>
              <button class="btn danger" onclick="delSeller('${esc(s.id)}')">Hapus</button>
            </div>
          </td>
        </tr>`).join('') || '<tr><td colspan="7">Belum ada data penjual.</td></tr>'}
      </table>
    </div>`;
}

function productsView() {
  return `<div class="box"><h3>Produk menunggu persetujuan</h3><table><tr><th>Produk</th><th>Penjual</th><th>Harga</th><th>Aksi</th></tr>${data.products.filter(p => p.status === 'Menunggu').map(p => `<tr><td>${esc(p.name)}</td><td>${esc(p.sellerName)}</td><td>${money(p.price)}</td><td><div class="actions"><button class="btn" onclick="productStatus('${esc(p.id)}','Aktif')">Setujui</button><button class="btn danger" onclick="productStatus('${esc(p.id)}','Ditolak')">Tolak</button></div></td></tr>`).join('') || '<tr><td colspan="4">Tidak ada produk menunggu.</td></tr>'}</table></div><div class="box"><h3 id="productFormTitle">Tambah Produk oleh Admin</h3><input type="hidden" id="productId"><div class="gridform"><div class="field"><label>Nama produk *</label><input id="pn" required></div><div class="field"><label>Harga (angka rupiah) *</label><input id="pp" type="number" min="1" required></div><div class="field"><label>Kategori</label><input id="pc"></div><div class="field"><label>Nama penjual</label><input id="ps" placeholder="TOKO KITA atau nama toko"></div><div class="field"><label>URL foto produk</label><input id="pi" type="url"></div><div class="field"><label>Deskripsi</label><input id="pd"></div><div class="field"><label>Status</label><select id="pstatus"><option>Aktif</option><option>Menunggu</option><option>Ditolak</option></select></div></div><div class="formactions"><button class="btn" onclick="saveProduct()">Simpan Produk</button><button class="btn alt hidden" id="cancelEdit" onclick="resetProductForm()">Batal Edit</button></div><p class="muted">Admin dapat menambah, mengedit, menyimpan perubahan, mengubah status, dan menghapus produk.</p></div><div class="box"><h3>Semua Produk</h3><table><tr><th>Produk</th><th>Penjual</th><th>Harga</th><th>Status</th><th>Aksi</th></tr>${data.products.map(p => `<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.category || '')}</span></td><td>${esc(p.sellerName)}</td><td>${money(p.price)}</td><td>${esc(p.status)}</td><td><div class="actions"><button class="btn alt" onclick="editProduct('${esc(p.id)}')">Edit</button><button class="btn danger" onclick="delProduct('${esc(p.id)}')">Hapus</button></div></td></tr>`).join('') || '<tr><td colspan="5">Belum ada produk.</td></tr>'}</table></div>`;
}

function settingsView() {
  let s = data.settings || {};
  return `<div class="box"><h3>Pengaturan Toko</h3><div class="field"><label>Nomor WhatsApp Admin (format 628xxx)</label><input id="wa" value="${esc(s.adminPhone || '')}"></div><div class="field"><label>Nama pemilik rekening</label><input id="holder" value="${esc(s.bankHolder || '')}"></div><div class="field"><label>Nama bank</label><input id="bank" value="${esc(s.bankName || '')}"></div><div class="field"><label>Nomor rekening</label><input id="account" value="${esc(s.bankAccount || '')}"></div><button class="btn" onclick="saveSettings()">Simpan Pengaturan</button></div>`;
}

function resetSellerForm() {
  ['sellerId', 'sname', 'sphone', 'saddress', 'scategory', 'spass', 'sexpiry', 'snote'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('sstatus').value = 'Aktif';
  document.getElementById('sellerFormTitle').textContent = 'Tambah Penjual Baru';
  document.getElementById('cancelSellerEdit').classList.add('hidden');
}

function editSeller(id) {
  let s = data.sellers.find(x => String(x.id) === String(id));
  if (!s) return;
  document.getElementById('sellerId').value = s.id;
  document.getElementById('sname').value = s.name || '';
  document.getElementById('sphone').value = s.phone || '';
  document.getElementById('saddress').value = s.address || '';
  document.getElementById('scategory').value = s.category || '';
  document.getElementById('spass').value = '';
  document.getElementById('sstatus').value = s.status || 'Aktif';
  document.getElementById('sexpiry').value = s.expiry || '';
  document.getElementById('snote').value = s.note || '';
  document.getElementById('sellerFormTitle').textContent = 'Edit Data Penjual (' + (s.storeCode || s.name) + ')';
  document.getElementById('cancelSellerEdit').classList.remove('hidden');
  document.getElementById('sellerFormTitle').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function saveSeller() {
  let id = document.getElementById('sellerId').value;
  let seller = {
    id,
    name: document.getElementById('sname').value.trim(),
    phone: cleanPhone(document.getElementById('sphone').value),
    address: document.getElementById('saddress').value.trim(),
    category: document.getElementById('scategory').value.trim(),
    password: document.getElementById('spass').value.trim(),
    status: document.getElementById('sstatus').value,
    expiry: document.getElementById('sexpiry').value,
    note: document.getElementById('snote').value.trim()
  };
  if (!seller.name || !seller.phone || seller.phone.length < 10) {
    alert('Nama penjual dan nomor WhatsApp (minimal 10 digit) wajib diisi.');
    return;
  }
  if (!id && seller.password.length < 6) {
    alert('Password penjual baru minimal 6 karakter.');
    return;
  }
  if (id && seller.password && seller.password.length < 6) {
    alert('Password baru minimal 6 karakter (atau kosongkan jika tidak diubah).');
    return;
  }
  try {
    await api(id ? 'updateSeller' : 'saveSeller', { seller });
    await refresh();
    tab('sellers', document.querySelectorAll('.tab')[1]);
    alert(id ? 'Data penjual berhasil diperbarui.' : 'Penjual baru berhasil ditambahkan.');
  } catch (e) {
    alert(e.message);
  }
}

async function delSeller(id) {
  let s = data.sellers.find(x => String(x.id) === String(id));
  if (!s) return;
  if (!confirm(`Hapus penjual "${s.name}" (${s.phone}) secara permanen?`)) return;
  let deleteProducts = confirm('Hapus juga semua produk milik penjual ini?\nKlik OK untuk hapus produknya juga, atau Cancel untuk tetap menyimpan produknya.');
  try {
    await api('deleteSeller', { id, deleteProducts });
    await refresh();
    tab('sellers', document.querySelectorAll('.tab')[1]);
    alert('Penjual berhasil dihapus.');
  } catch (e) {
    alert(e.message);
  }
}

async function act(a, p) {
  try {
    await api(a, p);
    await refresh();
    alert('Berhasil diperbarui.');
  } catch (e) {
    alert(e.message);
  }
}

async function approve(id) {
  let s = data.sellers.find(x => x.id === id);
  let days = prompt('Masa aktif dalam hari:', '30');
  if (days === null) return;
  if (!Number.isFinite(Number(days)) || Number(days) <= 0) {
    alert('Masukkan jumlah hari lebih dari 0.');
    return;
  }
  let expiry = new Date(Date.now() + Number(days) * 86400000).toISOString().slice(0, 10);
  await api('updateSeller', { id, status: 'Aktif', expiry });
  await refresh();
  tab('sellers', document.querySelectorAll('.tab')[1]);
  let storeCode = s.storeCode || ('TK-' + String(s.id).slice(0, 8).toUpperCase());
  let msg = `PENDAFTARAN PENJUAL DISETUJUI — TOKO KITA\nHalo ${s.name}, pendaftaran Anda telah disetujui.\nKODE TOKO: ${storeCode}\nLogin penjual: ${location.href.replace(/admin\.html.*$/, '')}penjual.html\nMasa aktif sampai: ${expiry}\n\nInformasi pembayaran biaya/aktivasi:\nBank: ${data.settings.bankName || '-'}\nNo. Rekening: ${data.settings.bankAccount || '-'}\nAtas nama: ${data.settings.bankHolder || '-'}\n\nSilakan lakukan pembayaran dan kirim bukti kepada admin.`;
  openWhatsApp(s.phone, msg);
}

function contactSeller(id) {
  let s = data.sellers.find(x => x.id === id);
  openWhatsApp(s.phone, `Halo ${s.name}, ini admin TOKO KITA.`);
}

async function confirmOrder(id) {
  let o = data.orders.find(x => x.id === id);
  await api('confirmOrder', { id });
  await refresh();
  let msg = `NOTA PEMBELIAN TOKO KITA\nNo: ${o.id}\nTanggal: ${o.date}\nPembeli: ${o.buyerName}\n${o.items.map(x => `${x.name} x${x.qty} — ${money(x.subtotal)}`).join('\n')}\nTOTAL: ${money(o.total)}\nStatus: DIKONFIRMASI\nTerima kasih telah berbelanja di TOKO KITA.`;
  openWhatsApp(o.phone, msg);
}

function viewOrder(id) {
  let o = data.orders.find(x => x.id === id);
  alert(`Pesanan ${o.id}\n${o.items.map(x => x.name + ' x' + x.qty).join('\n')}\nTotal: ${money(o.total)}\nAlamat: ${o.address}`);
}

async function productStatus(id, status) {
  await api('setProductStatus', { id, status });
  await refresh();
  tab('products', document.querySelectorAll('.tab')[2]);
}

function resetProductForm() {
  ['productId', 'pn', 'pp', 'pc', 'ps', 'pi', 'pd'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('pstatus').value = 'Aktif';
  document.getElementById('productFormTitle').textContent = 'Tambah Produk oleh Admin';
  document.getElementById('cancelEdit').classList.add('hidden');
}

function editProduct(id) {
  let p = data.products.find(x => String(x.id) === String(id));
  if (!p) return;
  document.getElementById('productId').value = p.id;
  document.getElementById('pn').value = p.name || '';
  document.getElementById('pp').value = p.price || '';
  document.getElementById('pc').value = p.category || '';
  document.getElementById('ps').value = p.sellerName || '';
  document.getElementById('pi').value = p.image || '';
  document.getElementById('pd').value = p.description || '';
  document.getElementById('pstatus').value = p.status || 'Aktif';
  document.getElementById('productFormTitle').textContent = 'Edit Produk';
  document.getElementById('cancelEdit').classList.remove('hidden');
  document.getElementById('productFormTitle').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function saveProduct() {
  let id = document.getElementById('productId').value,
      product = {
        id,
        name: document.getElementById('pn').value.trim(),
        price: document.getElementById('pp').value,
        category: document.getElementById('pc').value.trim(),
        sellerName: document.getElementById('ps').value.trim(),
        image: document.getElementById('pi').value.trim(),
        description: document.getElementById('pd').value.trim(),
        status: document.getElementById('pstatus').value
      };
  if (!product.name || !Number(product.price) || Number(product.price) <= 0) {
    alert('Isi nama produk dan harga yang benar.');
    return;
  }
  try {
    await api(id ? 'updateProduct' : 'saveProduct', { product });
    await refresh();
    tab('products', document.querySelectorAll('.tab')[2]);
    alert(id ? 'Perubahan produk berhasil disimpan.' : 'Produk berhasil ditambahkan.');
  } catch (e) {
    alert(e.message);
  }
}

async function delProduct(id) {
  if (confirm('Hapus produk ini secara permanen?')) {
    try {
      await api('deleteProduct', { id });
      await refresh();
      tab('products', document.querySelectorAll('.tab')[2]);
      alert('Produk berhasil dihapus.');
    } catch (e) {
      alert(e.message);
    }
  }
}

async function saveSettings() {
  await act('saveSettings', {
    settings: {
      adminPhone: cleanPhone(document.getElementById('wa').value),
      bankHolder: document.getElementById('holder').value,
      bankName: document.getElementById('bank').value,
      bankAccount: document.getElementById('account').value
    }
  });
}

function cleanPhone(phone) {
  let n = String(phone || '').replace(/\D/g, '');
  if (n.startsWith('0062')) n = n.slice(2);
  if (n.startsWith('0')) n = '62' + n.slice(1);
  else if (n.startsWith('8')) n = '62' + n;
  return n;
}

function openWhatsApp(phone, msg) {
  let n = cleanPhone(phone);
  if (!n || n.length < 10) {
    alert('Nomor WhatsApp tidak valid: ' + phone);
    return;
  }
  window.open('https://wa.me/' + n + '?text=' + encodeURIComponent(msg), '_blank');
}

if (token) show().catch(e => { alert(e.message); logout(); });
</script>
</body>
</html>
