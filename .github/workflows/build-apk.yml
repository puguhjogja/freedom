name: Build Android WebView APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Minimal Android Project
      run: |
        mkdir -p app/src/main/java/com/freedom/inside app/src/main/res/layout app/src/main/res/values app/src/main/res/xml
        
        # 1. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="FREEDOM-INSIDE"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 2. build.gradle (Module)
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.freedom.inside'
            compileSdk 34
            defaultConfig {
                applicationId "com.freedom.inside"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        # 3. build.gradle (Project)
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF

        # 4. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "FreedomInside"
        include ':app'
        EOF

        # 5. MainActivity.java (Logika WebView & Blokir intent:// Google Maps)
        cat << 'EOF' > app/src/main/java/com/freedom/inside/MainActivity.java
        package com.freedom.inside;

        import android.content.Intent;
        import android.net.Uri;
        import android.os.Bundle;
        import android.webkit.WebResourceRequest;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                setContentView(webView);

                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setLoadsImagesAutomatically(true);
                
                // Samarkan User-Agent menjadi Desktop Chrome agar Google Maps web terbuka penuh
                settings.setUserAgentString("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36");

                webView.setWebViewClient(new WebViewClient() {
                    @Override
                    public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                        String url = request.getUrl().toString();

                        // Cegah error ERR_UNKNOWN_URL_SCHEME dari Google Maps intent://
                        if (url.startsWith("intent://") || url.contains("com.google.android.apps.maps")) {
                            view.loadUrl("https://www.google.com/maps/search/");
                            return true;
                        }

                        // Tangani tombol WhatsApp agar membuka aplikasi WhatsApp langsung
                        if (url.startsWith("https://api.whatsapp.com/") || url.startsWith("whatsapp://")) {
                            try {
                                Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                startActivity(intent);
                            } catch (Exception e) {
                                // Fallback jika WA belum terinstal
                                view.loadUrl(url);
                            }
                            return true;
                        }

                        return false; 
                    }
                });

                // Ganti URL di bawah ini dengan link GitHub Pages (PWA FREEDOM-INSIDE) Anda
                webView.loadUrl("https://puguhjogja.github.io/freedom/");
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

        # 6. strings.xml
        mkdir -p app/src/main/res/values
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">FREEDOM-INSIDE</string>
        </resources>
        EOF

    - name: Make Gradle Executable
      run: chmod +x gradlew || true

    - name: Build APK with Gradle
      run: |
        # Buat gradle wrapper sederhana jika belum ada
        gradle wrapper
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FreedomInside-APK
        path: app/build/outputs/apk/debug/app-debug.apk
